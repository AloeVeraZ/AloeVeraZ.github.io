<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MATLAB engineering coursework graphic</title>
  <desc id="desc">An abstract three-dimensional surface plot over a dark engineering grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#161616"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#214f80"/><stop offset=".45" stop-color="#7ba8d8"/><stop offset=".72" stop-color="#e09b3d"/><stop offset="1" stop-color="#c84b31"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#7ba8d8" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
  <text x="74" y="106" fill="#7ba8d8" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="8">ENGINEERING COMPUTING</text>
  <text x="70" y="190" fill="#f4f4f1" font-family="Arial, sans-serif" font-size="78" font-weight="800">MATLAB</text>
