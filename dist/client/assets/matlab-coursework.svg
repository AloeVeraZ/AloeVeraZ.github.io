    <path d="M155 334C280 260 326 86 450 190S640 430 738 265 870 174 934 290L616 446C532 343 455 330 368 378S239 390 155 334Z" fill="url(#surface)" opacity=".95"/>
    <g fill="none" stroke="#f4f4f1" stroke-opacity=".3" stroke-width="2"><path d="M155 334C280 260 326 86 450 190S640 430 738 265 870 174 934 290"/><path d="M224 355C334 294 374 142 482 228S644 424 735 297 856 226 898 308"/><path d="M296 379C388 331 421 207 513 270S654 415 729 330 825 281 860 326"/><path d="M373 401C448 368 472 275 545 314S666 407 724 365 795 336 819 344"/><path d="M456 424C514 403 528 344 580 357S682 402 719 398 766 390 777 364"/></g>
  </g>
  <text x="75" y="694" fill="#f4f4f1" font-family="Arial, sans-serif" font-size="23">SCRIPTS  /  MATRICES  /  DATA  /  VISUALIZATION</text>
