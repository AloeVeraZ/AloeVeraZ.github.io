<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Autodesk Inventor coursework graphic</title>
  <desc id="desc">An exploded mechanical assembly drawn over a dark engineering grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#181818"/></linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5c5c0"/><stop offset=".5" stop-color="#555"/><stop offset="1" stop-color="#eee"/></linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#7ba8d8" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
  <text x="72" y="105" fill="#7ba8d8" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="8">PARAMETRIC DESIGN</text>
  <text x="68" y="190" fill="#f4f4f1" font-family="Arial,sans-serif" font-size="76" font-weight="800">INVENTOR</text>
  <g transform="translate(165 235)" stroke-linejoin="round">
    <path d="M80 265 315 168 545 247 307 352Z" fill="url(#part)" stroke="#e5e5e0" stroke-width="4"/>
    <path d="m340 161 168-69 166 58-171 75Z" fill="#7ba8d8" stroke="#b9d4f0" stroke-width="4"/>
    <path d="m590 264 161-66 150 52-164 72Z" fill="url(#part)" stroke="#e5e5e0" stroke-width="4"/>
    <g fill="none" stroke="#7ba8d8" stroke-width="3" stroke-dasharray="12 12" opacity=".8"><path d="m315 168 26-7"/><path d="m545 247 47 17"/><path d="m508 92 4-51"/><path d="m751 198 38-34"/></g>
    <g fill="#111" stroke="#f4f4f1" stroke-width="4"><ellipse cx="304" cy="261" rx="55" ry="25"/><ellipse cx="506" cy="161" rx="46" ry="21"/><ellipse cx="742" cy="260" rx="42" ry="20"/></g>
  </g>
  <text x="74" y="700" fill="#f4f4f1" font-family="Arial,sans-serif" font-size="23">PARTS  /  ASSEMBLIES  /  DRAWINGS  /  FEA</text>
  <text x="1080" y="700" fill="#7ba8d8" font-family="Arial,sans-serif" font-size="28" font-weight="700">06</text>
</svg>
